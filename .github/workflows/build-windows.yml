name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Test
        run: python -m pytest -q
      - name: Build
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name FLAC2AAC --collect-all PyQt6 app.py
      - name: Smoke test
        shell: pwsh
        run: |
          $exe = Resolve-Path dist/FLAC2AAC.exe
          $proc = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru
          if (-not $proc.WaitForExit(45000)) { Stop-Process -Id $proc.Id -Force; throw 'GUI smoke test timed out' }
          if ($proc.ExitCode -ne 0) { throw "GUI smoke test failed: $($proc.ExitCode)" }
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest *> $null
          if ($LASTEXITCODE -eq 0) { gh release delete latest --cleanup-tag -y }
          gh release create latest "dist/FLAC2AAC.exe#FLAC2AAC.exe" --target "${{ github.sha }}" --title "FLAC2AAC latest" --notes "Latest verified Windows standalone build."
